services:
  db:
    image: index.docker.io/library/postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # 18.6
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "postgres", "--host", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12
  cache:
    image: index.docker.io/library/memcached@sha256:ace04eccd7785ba9fac8f857b5a8eeb74ed3928d277563fa84bbd471a3ddc898 # 1.6.22
    ports:
      - "127.0.0.1:11211:11211"
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/11211 && printf 'version\\r\\n' >&3 && head -c 7 <&3 | grep -q VERSION",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
  search:
    image: index.docker.io/opensearchproject/opensearch@sha256:3bfa1ec74d56928c2e018033d45c460ce2c0ea65a5cedd577de3102326c31b89 # 2.19.7
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:9200/_cluster/health?wait_for_status=green&timeout=5s",
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 60s
  search-console:
    image: index.docker.io/opensearchproject/opensearch-dashboards@sha256:d3ad52a0e8721c815b11a96121ecce6432d2c7345c198dea8e07709cfc4e01fc # 2.19.7
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      - 'OPENSEARCH_HOSTS=["http://search:9200"]'
      - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true"
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:5601/api/status || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s
    depends_on:
      search:
        condition: service_healthy

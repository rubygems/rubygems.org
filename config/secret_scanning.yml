shared:
  github:
    identifier_header: GITHUB-PUBLIC-KEY-IDENTIFIER
    signature_header: GITHUB-PUBLIC-KEY-SIGNATURE
    keys_uri: https://api.github.com/meta/public_keys/secret_scanning
    # Preserve existing cached keys across internal Ruby class renames.
    cache_namespace: GitHubSecretScanning
  deps_dev:
    identifier_header: DepsDev-Public-Key-Identifier
    signature_header: DepsDev-Public-Key-Signature
    keys_uri: https://storage.googleapis.com/depsdev-gcp-public-keys/secret_scanning
    cache_namespace: GitHubSecretScanning::DepsDev

[settings]
# Use the Ruby version from .ruby-version
idiomatic_version_file_enable_tools = ["ruby"]

[tasks.services]
description = "Start Docker Compose services and wait until they are healthy"
run = "docker compose up --detach --wait db cache search"

[tasks.setup]
description = "Install dependencies and prepare the app"
depends = ["services"]
run = "bin/setup"

[tasks.test]
description = "Run the Rails test suite, including system tests (pass a file or test to run just that)"
depends = ["services"]
usage = 'arg "[args]" var=#true help="Files or other bin/rails test arguments"'
# bin/rails test:all runs every test even when given files, so use bin/rails test for arguments
run = '''
if [ -z "${usage_args:-}" ]; then
  bin/rails test:all
else
  eval "set -- $usage_args"
  bin/rails test "$@"
fi
'''
